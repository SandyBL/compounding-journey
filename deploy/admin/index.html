<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Studio | Compounding Journey</title>
    <style>
      /*
       * Every rule here is scoped to this page's own two screens - the sign-in
       * card and the "opening the studio" splash. Nothing is left on a bare
       * element selector, and that is load-bearing rather than tidy.
       *
       * Decap renders the entire content studio into this same document, not
       * into an iframe, so a rule written as `button { ... }` reaches every
       * button the CMS draws. The markdown editor's toolbar is a row of icon
       * buttons that carry no width of their own, so `width: 100%` made each
       * one a full-width block: the toolbar stopped being a toolbar and became
       * a column as tall as the number of icons on it, leaving a sliver of the
       * window for the text being written. `input`, `label`, `p` and `h1` were
       * leaking into the studio's chrome the same way, one cosmetic step short
       * of the same problem.
       *
       * Scoping them in does not leave the CMS unstyled: Decap injects its own
       * reset - box-sizing, the body font and background, a font for buttons -
       * so what these rules stop overriding, it styles itself. Anything added
       * to this block from now on belongs under .auth-shell, .auth-card or
       * .loading for the same reason.
       */
      :root { color-scheme: light; }
      body { margin: 0; }
      .auth-shell, .loading { min-height: 100vh; display: grid; place-items: center; background: #f5f1e8; color: #183a25; font-family: ui-sans-serif, system-ui, sans-serif; }
      .auth-shell { padding: 24px; }
      .auth-shell *, .auth-shell *::before, .auth-shell *::after { box-sizing: border-box; }
      .auth-card { width: min(100%, 430px); padding: 38px; border: 1px solid #ded5c3; border-radius: 24px; background: #fffdf8; box-shadow: 0 24px 80px rgba(24, 58, 37, .14); }
      .auth-card img { width: 72px; height: 72px; object-fit: contain; }
      .auth-card h1 { margin: 20px 0 8px; font-family: Georgia, serif; font-size: 2rem; }
      .auth-card p { margin: 0 0 24px; color: #5d665e; line-height: 1.6; }
      .auth-card label { display: block; margin-top: 16px; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      .auth-card input { width: 100%; margin-top: 7px; padding: 13px 14px; border: 1px solid #cfc6b5; border-radius: 10px; font: inherit; background: white; }
      .auth-card input:focus { outline: 3px solid rgba(197, 155, 39, .24); border-color: #c59b27; }
      .auth-card button { width: 100%; margin-top: 22px; padding: 14px 18px; border: 0; border-radius: 10px; background: #1e4620; color: white; font: inherit; font-weight: 800; cursor: pointer; }
      .auth-card button:hover { background: #173719; }
      .auth-card button:disabled { opacity: .65; cursor: wait; }
      .auth-card .status { min-height: 24px; margin: 14px 0 0; color: #9b2c2c; font-size: .9rem; }
      .loading { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      .auth-shell[hidden], .loading[hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="auth-shell" class="auth-shell">
      <form id="login-form" class="auth-card">
        <img src="/.netlify/images?url=/sandy-bradbury-portrait.png&amp;w=144&amp;h=144&amp;fit=cover" alt="" width="72" height="72" decoding="async" />
        <h1>Content Studio</h1>
        <p>Sign in with your invited Netlify Identity account to manage the trilingual journal.</p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button id="login-button" type="submit">Open dashboard</button>
        <p id="auth-status" class="status" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <div id="cms-loading" class="loading" hidden>Opening content studio…</div>

    <script type="module">
      import { getUser, login } from '/assets/js/netlify-identity-1.2.0.js';

      const authShell = document.querySelector('#auth-shell');
      const loading = document.querySelector('#cms-loading');
      const form = document.querySelector('#login-form');
      const button = document.querySelector('#login-button');
      const status = document.querySelector('#auth-status');

      async function loadCMS() {
        authShell.hidden = true;
        loading.hidden = false;
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/decap-cms@3.15.1/dist/decap-cms.js';
        script.onload = () => { loading.hidden = true; };
        script.onerror = () => {
          loading.textContent = 'The CMS could not load. Check your connection and refresh.';
        };
        document.body.appendChild(script);
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        status.textContent = '';
        const data = new FormData(form);
        try {
          await login(String(data.get('email')), String(data.get('password')));
          await loadCMS();
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : 'Unable to sign in.';
          button.disabled = false;
        }
      });

      if (await getUser()) await loadCMS();
    </script>
  </body>
</html>
