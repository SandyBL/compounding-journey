backend:
  name: git-gateway
  branch: main

site_url: "https://compoundingjourney.com"
display_url: "https://compoundingjourney.com"
logo_url: "/icone%20foto%20limpo.png"
# Required by the CMS even though nothing in the editor can reach it any more:
# the image component has been removed from every body field, so there is no
# control left that opens the media library or writes a path into an article.
media_folder: "deploy/assets/uploads"
public_folder: "/assets/uploads"

show_preview_links: true
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "blog_en"
    label: "Blog — English"
    label_singular: "English article"
    folder: "deploy/content/blog/en"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publication date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Category", name: "category", widget: "select", options: ["Money habits", "Investing", "Financial freedom", "Life design"] }
      - { label: "Summary", name: "summary", widget: "text", hint: "Used on listing pages and in the SEO description." }
      - { label: "Translation key", name: "translation_key", widget: "string", hint: "Use the same key for all language versions." }
      - { label: "Author", name: "author", widget: "string", default: "Sandy Bradbury" }
      - { label: "Body", name: "body", widget: "markdown", editor_components: ["code-block"] }

  - name: "blog_es"
    label: "Blog — Español"
    label_singular: "Artículo en español"
    folder: "deploy/content/blog/es"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de publicación", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Categoría", name: "category", widget: "select", options: ["Hábitos financieros", "Inversión", "Libertad financiera", "Diseño de vida"] }
      - { label: "Resumen", name: "summary", widget: "text", hint: "Se usa en las listas de artículos y en la descripción SEO." }
      - { label: "Clave de traducción", name: "translation_key", widget: "string", hint: "Usa la misma clave en las versiones de todos los idiomas." }
      - { label: "Autor", name: "author", widget: "string", default: "Sandy Bradbury" }
      - { label: "Contenido", name: "body", widget: "markdown", editor_components: ["code-block"] }

  - name: "blog_pt"
    label: "Blog — Português"
    label_singular: "Artigo em português"
    folder: "deploy/content/blog/pt"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data de publicação", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Categoria", name: "category", widget: "select", options: ["Hábitos financeiros", "Investimentos", "Liberdade financeira", "Design de vida"] }
      - { label: "Resumo", name: "summary", widget: "text", hint: "Usado nas listas de artigos e na descrição de SEO." }
      - { label: "Chave de tradução", name: "translation_key", widget: "string", hint: "Use a mesma chave nas versões de todos os idiomas." }
      - { label: "Autor", name: "author", widget: "string", default: "Sandy Bradbury" }
      - { label: "Conteúdo", name: "body", widget: "markdown", editor_components: ["code-block"] }
