  <div id="modal-add-snapshot" class="app-modal no-print fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">

      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
