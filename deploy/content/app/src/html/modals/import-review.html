<!-- MODAL: IMPORT REVIEW (shown before EITHER import path — JSON or Excel — applies
     anything: a per-section summary of what would change, so importing is never a
     blind "replace everything?" confirmation. Cancel leaves the profile untouched. -->
<div id="modal-import-review" class="app-modal no-print fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
  <div class="glass-card max-w-lg w-full rounded-2xl p-5 border border-slate-700 space-y-3 shadow-2xl max-h-[85vh] flex flex-col">
    <div class="flex items-start gap-3">
      <span class="text-2xl">🔍</span>
      <div class="flex-1 min-w-0">
        <h3 class="font-bold text-white text-sm" data-i18n="diffReviewTitle">O que vai mudar ao importar</h3>
        <p class="text-xs text-slate-400 mt-1" id="import-review-subtitle"></p>
      </div>
    </div>
    <div id="import-review-sections" class="flex-1 overflow-y-auto space-y-2 text-xs pr-1 modal-scroll-area"></div>
    <div class="flex items-center gap-2 justify-end pt-2 border-t border-slate-800">
      <button onclick="closeImportReviewModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition" data-i18n="confirmModalDefaultCancel">.</button>
      <button onclick="confirmImportReview()" class="px-4 py-2 rounded-xl bg-gold-500 hover:bg-gold-400 text-slate-950 font-black text-xs transition" data-i18n="diffApplyImport">Aplicar importação</button>
    </div>
  </div>
</div>
