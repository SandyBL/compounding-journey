  <!-- MODAL: ADD SNAPSHOT -->
  <!-- Reusable Confirm/Alert Modal (replaces native browser confirm()/alert()
       for destructive actions and notices, so they match the app's own visual
       language instead of looking like a jarring browser popup) -->
  <div id="modal-confirm-action" class="app-modal no-print fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full rounded-2xl p-5 border border-slate-700 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto modal-scroll-area">
      <div class="flex items-start gap-3">
        <span class="text-2xl" id="confirm-modal-icon">⚠️</span>
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-white text-sm" id="confirm-modal-title"></h3>
          <p class="text-xs text-slate-400 mt-1.5 whitespace-pre-line" id="confirm-modal-body"></p>
        </div>
      </div>
      <div class="flex items-center gap-2 justify-end">
        <button onclick="handleConfirmModalCancel()" id="confirm-modal-cancel-btn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition">
          Cancelar
        </button>
        <button onclick="handleConfirmModalConfirm()" id="confirm-modal-confirm-btn" class="px-4 py-2 rounded-xl bg-gold-500 hover:bg-gold-400 text-slate-950 font-black text-xs transition">
          Continuar
        </button>
      </div>
    </div>
  </div>
