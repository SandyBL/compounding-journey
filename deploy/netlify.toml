# Publishing an article in the content studio commits Markdown and nothing else.
# Regenerating on every deploy is what keeps the catalog, the pre-rendered
# article pages, the pre-rendered home pages and the sitemap in step with that
# Markdown and with content/home/index.html.
#
# No publish directory is set here on purpose: the project already builds from
# this folder, and overriding it in config would be a second place to get wrong.
#
# assets/styles.css is compiled Tailwind output. It used to be produced by hand
# and committed, which let it drift out of step with the markup: utilities added
# to the template had no rule in the bundle, so the elements using them shipped
# unstyled and the deploy still went green. Building it here, after the
# generators have written the pages it scans, is what keeps the two in step.
# version-assets.mjs then runs last of all, because it hashes that bundle and
# stamps the hash into the pages that link it — which is only possible once both
# the pages and the bundle exist.
#
# generate-manifests.mjs runs after every page generator and before the stamp,
# because it edits pages the generators have just written: it links each one to
# the manifest for its own language. It patches between markers rather than
# appending, so running it twice leaves one block, not two.
#
# verify-output.mjs closes the chain. It reads what the steps above actually
# wrote and fails the build on the three things that have gone wrong here before
# and that nothing else notices: a version token written by hand instead of
# hashed, an asset linked with no caching rule to match it, and a page whose
# declared language disagrees with the URL it is served from. Each of those was
# found by reading the output; this is what reads it every time.
#
# The install is explicit. Netlify only runs its automatic dependency step when
# it finds a lockfile, and this project had none, which left the Tailwind CLI off
# the PATH and failed the build with exit 127. Stating the install here does not
# depend on that detection, so it keeps working whether or not a lockfile is
# present. The only dependency is the CLI itself, pinned to an exact version in
# package.json.
#
# check-glossary-coverage.mjs writes nothing. It reads the catalog and reports
# the terms the articles use that the glossary cannot explain, with a written
# draft for each, and exits 0 either way: a missing glossary entry is editorial
# debt, not a broken page, and failing a deploy over it would mean a finished
# article cannot ship until three paragraphs of glossary are written. Pass
# --strict to that script to make the report a build failure instead.
#
# The order is not arbitrary. generate-blog-catalog.mjs writes the catalog every
# later generator reads; the page generators then run in any order among
# themselves except that generate-blog-pages.mjs and generate-category-pages.mjs
# both write under /{lang}/blog/ and each prunes stale output, so the category
# archives are written after the articles. generate-llms-txt.mjs and
# generate-sitemap.mjs enumerate what the others produced and so run last of the
# generators; npm run css compiles Tailwind against the finished markup, and
# version-assets.mjs stamps content hashes into every page after that, which is
# why nothing may write a page or an asset once it has run. verify-output.mjs is
# last and fails the build on a broken invariant.
[build]
  command = """
npm install --no-audit --no-fund && \
node scripts/generate-blog-catalog.mjs && \
node scripts/check-glossary-coverage.mjs && \
node scripts/generate-home-pages.mjs && \
node scripts/generate-blog-pages.mjs && \
node scripts/generate-simulator-pages.mjs && \
node scripts/generate-simulators-index.mjs && \
node scripts/generate-tool-pages.mjs && \
node scripts/generate-template-pages.mjs && \
node scripts/generate-glossary.mjs && \
node scripts/generate-category-pages.mjs && \
node scripts/generate-legal-pages.mjs && \
node scripts/generate-sessions-page.mjs && \
node scripts/generate-data-pages.mjs && \
node scripts/generate-llms-txt.mjs && \
node scripts/generate-manifests.mjs && \
node scripts/generate-sitemap.mjs && \
npm run css && \
node scripts/version-assets.mjs && \
node scripts/verify-output.mjs
"""

# The generators are Node ESM. Pin the runtime so a change to the Netlify
# default cannot alter the build without a commit saying so.
[build.environment]
  NODE_VERSION = "22"
