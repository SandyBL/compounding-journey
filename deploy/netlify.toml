# Publishing an article in the content studio commits Markdown and nothing else.
# Regenerating on every deploy is what keeps the catalog, the pre-rendered
# article pages, the pre-rendered home pages and the sitemap in step with that
# Markdown and with content/home/index.html.
#
# No publish directory is set here on purpose: the project already builds from
# this folder, and overriding it in config would be a second place to get wrong.
#
# assets/styles.css is compiled Tailwind output. It used to be produced by hand
# and committed, which let it drift out of step with the markup: utilities added
# to the template had no rule in the bundle, so the elements using them shipped
# unstyled and the deploy still went green. Building it here, after the
# generators have written the pages it scans, is what keeps the two in step.
# version-assets.mjs then runs last of all, because it hashes that bundle and
# stamps the hash into the pages that link it — which is only possible once both
# the pages and the bundle exist.
#
# The install is explicit. Netlify only runs its automatic dependency step when
# it finds a lockfile, and this project had none, which left the Tailwind CLI off
# the PATH and failed the build with exit 127. Stating the install here does not
# depend on that detection, so it keeps working whether or not a lockfile is
# present. The only dependency is the CLI itself, pinned to an exact version in
# package.json.
[build]
  command = "npm install --no-audit --no-fund && node scripts/generate-blog-catalog.mjs && node scripts/generate-home-pages.mjs && node scripts/generate-blog-pages.mjs && node scripts/generate-llms-txt.mjs && npm run css && node scripts/version-assets.mjs"

# The generators are Node ESM. Pin the runtime so a change to the Netlify
# default cannot alter the build without a commit saying so.
[build.environment]
  NODE_VERSION = "22"
